<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>og-image template (screenshot the viewport at 1200x630)</title>
<style>
  html, body { margin: 0; }
  body { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #1e4da1; color: #faf7f0; font-family: Georgia, "Times New Roman", serif; }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 14px; background: linear-gradient(90deg, #009246 0 33.33%, #fff 33.33% 66.66%, #ce2b37 66.66% 100%); }
  .card { position: absolute; left: 80px; top: 115px; width: 460px; height: 400px; border-radius: 32px; background: #fff; display: flex; align-items: center; justify-content: center; }
  .card img { width: 400px; height: auto; }
  .wrap { position: absolute; left: 600px; right: 80px; top: 50%; transform: translateY(-50%); }
  .tag { margin: 0 0 20px; font-size: 44px; font-weight: 600; line-height: 1.2; }
  .sub { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 26px; line-height: 1.4; opacity: 0.9; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="card"><img src="logo-og.png" alt=""></div>
  <div class="wrap">
    <p class="tag">Autentisk italiensk mad, lige fra vores food truck</p>
    <p class="sub">Frisk pasta, focaccia og italienske desserter · Greve og omegn</p>
  </div>
</body>
</html>
